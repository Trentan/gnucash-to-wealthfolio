name: CI

on:
  push:
    branches: [ main, generalize-engine ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run synthetic unit test suite
        run: |
          python -m unittest tests/test_parser.py tests/test_heuristics.py tests/test_mapper.py tests/test_migrator.py tests/test_config.py tests/test_backups.py tests/test_editor_api.py

      - name: Test CLI entrypoints
        run: |
          gnc2wf --help
          gnucash-to-wealthfolio --help
