[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gnucash-to-wealthfolio"
version = "0.2.0"
description = "Sync, map, and migrate GnuCash accounts and transactions to Wealthfolio with cent-exact reconciliation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Trentan Healey" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
gnc2wf = "gnucash_to_wealthfolio.cli:main"
gnucash-to-wealthfolio = "gnucash_to_wealthfolio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnucash_to_wealthfolio*"]

[tool.setuptools.package-data]
gnucash_to_wealthfolio = [
    "templates/*.json",
    "web/*.html",
]
